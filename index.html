<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e5eff">
<title>Generator Koordinat</title>
<style>
  :root{
    --blue-900:#0b2a6f;
    --blue-700:#1448d6;
    --blue-600:#1e5eff;
    --blue-500:#3b82f6;
    --blue-100:#e6efff;
    --blue-50:#f3f7ff;
    --text:#14213d;
    --muted:#6b7a99;
    --white:#ffffff;
    --danger:#e5484d;
    --ok:#16a34a;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--blue-50);
    color:var(--text);
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .hero{
    background:linear-gradient(145deg,var(--blue-900),var(--blue-600));
    color:var(--white);
    padding:calc(28px + env(safe-area-inset-top)) 20px 70px;
    border-radius:0 0 32px 32px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;
    background:rgba(255,255,255,.08);border-radius:50%;
  }
  .hero::before{
    content:"";position:absolute;right:50px;bottom:-70px;width:140px;height:140px;
    background:rgba(255,255,255,.06);border-radius:50%;
  }
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .logo{
    width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;backdrop-filter:blur(6px);
  }
  .logo svg{width:26px;height:26px}
  .hero h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
  .hero p{margin:2px 0 0;font-size:13px;opacity:.85}

  .wrap{max-width:520px;margin:-48px auto 0;padding:0 16px 32px;position:relative;z-index:2}
  .card{
    background:var(--white);border-radius:var(--radius);padding:18px;
    box-shadow:0 10px 30px rgba(20,72,214,.12);margin-bottom:16px;
  }
  label{display:block;font-size:13px;font-weight:600;color:var(--blue-700);margin-bottom:8px}
  .field{
    display:flex;align-items:center;gap:10px;background:var(--blue-50);
    border:2px solid transparent;border-radius:14px;padding:0 14px;transition:.2s;
  }
  .field:focus-within{border-color:var(--blue-500);background:var(--white)}
  .field svg{width:20px;height:20px;flex:none;color:var(--blue-600)}
  .field input{
    flex:1;border:0;outline:0;background:transparent;font-size:16px;
    padding:15px 0;color:var(--text);min-width:0;
  }
  .field input::placeholder{color:#a3afc9}

  .btn{
    width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    transition:transform .1s,box-shadow .2s,opacity .2s;font-family:inherit;
  }
  .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px}
  .btn-primary{
    background:linear-gradient(135deg,var(--blue-600),var(--blue-700));color:var(--white);
    box-shadow:0 8px 18px rgba(30,94,255,.35);margin-top:14px;
  }
  .btn-ghost{
    background:var(--blue-100);color:var(--blue-700);margin-top:10px;font-size:14px;padding:12px;
  }
  .btn-copy{background:var(--blue-600);color:var(--white);box-shadow:0 8px 18px rgba(30,94,255,.3)}
  .btn-clear{background:var(--white);color:var(--danger);border:2px solid #fbd5d6}
  .btn[disabled]{opacity:.55;pointer-events:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

  .result-title{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
    color:var(--blue-700);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.15)}
  .loc-label{font-size:20px;font-weight:700;color:var(--blue-900);margin:0 0 6px;line-height:1.3;word-break:break-word}
  .loc-name{font-size:14px;font-weight:500;color:var(--muted);line-height:1.5;margin:0 0 16px;word-break:break-word}
  .coords{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .coord{background:var(--blue-50);border-radius:14px;padding:12px 14px}
  .coord small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .coord b{font-size:17px;color:var(--blue-900);font-variant-numeric:tabular-nums;word-break:break-all}
  .maplink{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;
    color:var(--blue-600);text-decoration:none;font-weight:600;
  }

  .choices{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .choices .hint{font-size:12px;color:var(--muted);margin:0 0 2px}
  .choice{
    text-align:left;border:2px solid var(--blue-100);background:var(--white);border-radius:12px;
    padding:10px 12px;font-size:13px;line-height:1.4;color:var(--text);cursor:pointer;font-family:inherit;
  }
  .choice.active{border-color:var(--blue-600);background:var(--blue-50)}

  .empty{text-align:center;color:var(--muted);padding:26px 10px}
  .empty svg{width:46px;height:46px;color:#b8c8ee;margin-bottom:8px}
  .empty p{margin:0;font-size:14px}

  .msg{margin-top:12px;font-size:13px;color:var(--danger);display:none}
  .spin{
    width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;animation:s .7s linear infinite;display:none;
  }
  .loading .spin{display:block}
  .loading .ico{display:none}
  @keyframes s{to{transform:rotate(360deg)}}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%,30px);background:var(--blue-900);color:#fff;
    padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
    transition:.3s;z-index:10;box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
  .hidden{display:none!important}
</style>
</head>
<body>

<header class="hero">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
    </div>
    <div>
      <h1>Generator Koordinat</h1>
      <p>Cari lokasi, dapatkan koordinat, bagikan ke WhatsApp</p>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="card">
    <label for="lokasi">Lokasi</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="lokasi" type="text" placeholder="Contoh: Monas, Jakarta" autocomplete="off" enterkeyhint="search">
    </div>

    <button id="btnLoad" class="btn btn-primary">
      <span class="spin"></span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      <span id="btnLoadText">Load Koordinat</span>
    </button>

    <button id="btnGps" class="btn btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
      Gunakan lokasi saya sekarang
    </button>

    <div id="msg" class="msg"></div>
  </section>

  <section class="card" id="hasil">
    <div id="empty" class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <p>Belum ada data.<br>Masukkan lokasi lalu tekan <b>Load Koordinat</b>.</p>
    </div>

    <div id="data" class="hidden">
      <div class="result-title"><span class="dot"></span>Hasil Lokasi</div>
      <h2 class="loc-label" id="outLabel"></h2>
      <p class="loc-name" id="outNama"></p>
      <div class="coords">
        <div class="coord"><small>Latitude</small><b id="outLat"></b></div>
        <div class="coord"><small>Longitude</small><b id="outLon"></b></div>
      </div>
      <a id="outMap" class="maplink" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M10 14L21 3M21 14v7H3V3h7"/></svg>
        Buka di Google Maps
      </a>

      <div id="choices" class="choices hidden"></div>

      <div class="row">
        <button id="btnCopy" class="btn btn-copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          Copy WA
        </button>
        <button id="btnClear" class="btn btn-clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          Hapus Data
        </button>
      </div>
    </div>
  </section>

  <div class="foot">Data lokasi: OpenStreetMap Nominatim</div>
</main>

<div id="toast" class="toast"></div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var input = $('lokasi'), btnLoad = $('btnLoad'), btnGps = $('btnGps');
  var msg = $('msg'), empty = $('empty'), data = $('data'), choices = $('choices');
  var results = [], current = null;

  function toast(t){
    var el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){el.classList.remove('show')}, 2000);
  }
  function showError(t){ msg.textContent = t; msg.style.display = 'block'; }
  function hideError(){ msg.style.display = 'none'; }
  function setLoading(on, text){
    btnLoad.classList.toggle('loading', on);
    btnLoad.disabled = on; btnGps.disabled = on;
    $('btnLoadText').textContent = on ? (text || 'Memuat...') : 'Load Koordinat';
  }
  function fmt(n){ return Number(n).toFixed(6); }

  function render(item){
    current = item;
    empty.classList.add('hidden'); data.classList.remove('hidden');
    $('outLabel').textContent = item.label;
    $('outNama').textContent = item.name;
    $('outLat').textContent = fmt(item.lat);
    $('outLon').textContent = fmt(item.lon);
    $('outMap').href = 'https://www.google.com/maps?q=' + fmt(item.lat) + ',' + fmt(item.lon);
    renderChoices();
  }

  function renderChoices(){
    if(results.length < 2){ choices.classList.add('hidden'); choices.innerHTML=''; return; }
    choices.classList.remove('hidden');
    choices.innerHTML = '<p class="hint">Ditemukan beberapa hasil, pilih yang sesuai:</p>';
    results.forEach(function(r){
      var b = document.createElement('button');
      b.className = 'choice' + (r === current ? ' active' : '');
      b.textContent = r.name;
      b.onclick = function(){ render(r); };
      choices.appendChild(b);
    });
  }

  function clearAll(){
    results = []; current = null;
    data.classList.add('hidden'); empty.classList.remove('hidden');
    choices.innerHTML = ''; input.value = ''; hideError();
  }

  async function loadKoordinat(){
    var q = input.value.trim();
    hideError();
    if(!q){ showError('Silakan isi lokasi terlebih dahulu.'); input.focus(); return; }
    setLoading(true);
    try{
      var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=id&q=' + encodeURIComponent(q);
      var res = await fetch(url);
      if(!res.ok) throw new Error('Server error');
      var json = await res.json();
      if(!json.length){ showError('Lokasi tidak ditemukan. Coba kata kunci yang lebih spesifik.'); return; }
      results = json.map(function(j){ return {label:q, name:j.display_name, lat:j.lat, lon:j.lon}; });
      render(results[0]);
      input.blur();
    }catch(e){
      showError('Gagal memuat koordinat. Periksa koneksi internet Anda.');
    }finally{
      setLoading(false);
    }
  }

  function gunakanGps(){
    hideError();
    if(!navigator.geolocation){ showError('Perangkat tidak mendukung GPS.'); return; }
    setLoading(true, 'Mencari GPS...');
    navigator.geolocation.getCurrentPosition(async function(pos){
      var lat = pos.coords.latitude, lon = pos.coords.longitude, name = 'Lokasi Saya';
      try{
        var r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=id&lat='+lat+'&lon='+lon);
        var j = await r.json();
        if(j && j.display_name) name = j.display_name;
      }catch(e){}
      results = []; input.value = '';
      render({label:'Lokasi Saya', name:name, lat:lat, lon:lon});
      setLoading(false);
    }, function(){
      setLoading(false);
      showError('Tidak bisa mengambil lokasi. Pastikan izin lokasi diaktifkan.');
    }, {enableHighAccuracy:true, timeout:15000});
  }

  function waText(){
    var lat = fmt(current.lat), lon = fmt(current.lon);
    return '📍 *Lokasi*\n*' + current.label + '*\n' + current.name + '\n\n' +
           '🧭 *Koordinat*\n' + lat + ', ' + lon + '\n\n' +
           '🗺️ *Peta*\nhttps://www.google.com/maps?q=' + lat + ',' + lon;
  }

  async function copyWA(){
    if(!current) return;
    var text = waText();
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
    }
    toast('Tersalin! Tinggal tempel di WhatsApp');
  }

  btnLoad.addEventListener('click', loadKoordinat);
  btnGps.addEventListener('click', gunakanGps);
  $('btnCopy').addEventListener('click', copyWA);
  $('btnClear').addEventListener('click', function(){ clearAll(); toast('Data dihapus'); });
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') loadKoordinat(); });
})();
</script>
</body>
</html>
